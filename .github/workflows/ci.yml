name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - validation/draft-chunk2-economy

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run data:update
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-launch Electron
        shell: pwsh
        run: |
          $env:ELECTRON_SMOKE_TEST = '1'
          npx electron .
