name: Refresh operator data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operator-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run data:update -- --force
      - run: npm run data:images
      - run: npm run data:validate
      - name: Commit updated dataset
        shell: bash
        run: |
          if git diff --quiet -- resources/bundled-data/operators/operators.json; then
            echo "No operator dataset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/bundled-data/operators/operators.json
          git commit -m "data: refresh operator dataset"
          git push
