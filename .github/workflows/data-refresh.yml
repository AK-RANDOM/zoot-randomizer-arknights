name: Validate operator data refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run data:update -- --force
      - run: npm run data:images
      - run: npm run data:validate
