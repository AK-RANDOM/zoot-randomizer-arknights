name: Finalize public migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migration-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate neutral lockfile
        run: npm install --package-lock-only
      - name: Verify neutral package identity
        shell: pwsh
        run: |
          if (Select-String -Path package-lock.json -Pattern 'neapolitan' -CaseSensitive:$false -Quiet) {
            throw 'Retired private branding remains in package-lock.json.'
          }
          node -e "const p=require('./package-lock.json'); if (p.name !== 'arknights-randomizer' || p.packages?.['']?.name !== 'arknights-randomizer') { console.error('Unexpected package identity in package-lock.json'); process.exit(1) }"
      - name: Clean install from generated lockfile
        run: npm ci
      - name: Regenerate operator data and artwork
        run: npm run data:update:images
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-launch Electron
        shell: pwsh
        run: |
          $env:ELECTRON_SMOKE_TEST = '1'
          npx electron .
      - name: Verify tracked-tree branding scrub
        shell: pwsh
        run: |
          git add package-lock.json
          $matches = git grep -i -n 'neapolitan' -- .
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Host
            throw 'Retired private branding remains in the tracked tree.'
          }
          if ($LASTEXITCODE -ne 1) { throw "git grep failed with exit code $LASTEXITCODE" }
      - name: Commit neutral lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add neutral dependency lockfile"
          git push
