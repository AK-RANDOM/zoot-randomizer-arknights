name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run data:update
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:win
      - name: Verify portable launch
        shell: pwsh
        run: |
          $env:ELECTRON_SMOKE_TEST = '1'
          $portable = Get-ChildItem dist/*-Portable.exe | Select-Object -First 1
          if (-not $portable) { throw 'Portable executable was not produced.' }

          $portableProcess = Start-Process -FilePath $portable.FullName -PassThru
          if (-not $portableProcess.WaitForExit(60000)) {
            $portableProcess.Kill()
            throw 'Portable application did not complete the smoke launch.'
          }

          if ($portableProcess.ExitCode -ne 0) {
            throw "Portable application exited with code $($portableProcess.ExitCode)."
          }

          $portableData = Join-Path $portable.DirectoryName 'Arknights-Randomizer-Data'
          if (-not (Test-Path $portableData)) {
            throw 'Portable application did not create its sidecar data directory.'
          }
          Remove-Item $portableData -Recurse -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: dist/*-Portable.exe
          if-no-files-found: error
