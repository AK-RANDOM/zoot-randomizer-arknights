name: Build Windows release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run data:update
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build raw Windows Electron directory
        run: npm run build && npx electron-builder --win --dir --publish never
      - name: Verify raw Windows launch
        shell: pwsh
        run: |
          $env:ELECTRON_SMOKE_TEST = '1'
          $app = Get-ChildItem dist/win-unpacked/*.exe | Select-Object -First 1
          if (-not $app) { throw 'Raw Windows executable was not produced.' }

          $process = Start-Process -FilePath $app.FullName -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Raw Windows application did not complete the smoke launch.'
          }

          if ($process.ExitCode -ne 0) {
            throw "Raw Windows application exited with code $($process.ExitCode)."
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-raw-electron
          path: dist/win-unpacked/**
          if-no-files-found: error
      - name: Package Windows portable app
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        with:
          name: windows-portable
          path: dist/*-x64-Portable.exe
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-portable
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          assets=(./*-x64-Portable.exe)
          if [[ ${#assets[@]} -ne 1 || ! -f "${assets[0]}" ]]; then
            echo "Expected exactly one Windows portable executable." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            version=${assets[0]#./Arknights-Randomizer-}
            version=${version%-x64-Portable.exe}
            tag="v$version"
            tagged_sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null || true)
            if [[ -n "$tagged_sha" && "$tagged_sha" != "$GITHUB_SHA" ]]; then
              tag="$tag-build.${GITHUB_SHA:0:12}"
            fi
            title="Arknights Randomizer $tag"
            flags=(--latest=false)
          else
            tag="windows-dev-$GITHUB_SHA"
            title="Windows dev build ${GITHUB_SHA:0:7}"
            flags=(--prerelease --latest=false)
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${assets[0]}" --clobber
              gh release edit "$tag" --draft=false --latest=false
            fi
          else
            gh release create "$tag" "${assets[0]}" \
              --target "$GITHUB_SHA" --title "$title" \
              --generate-notes "${flags[@]}"
          fi
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [[ "$GITHUB_SHA" == "$main_sha" ]]; then
              gh release edit "$tag" --latest
            fi
          fi
