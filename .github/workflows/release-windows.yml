name: Build Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run data:update
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build raw Windows Electron directory
        run: npm run build && npx electron-builder --win --dir --publish never
      - name: Verify raw Windows launch
        shell: pwsh
        run: |
          $env:ELECTRON_SMOKE_TEST = '1'
          $app = Get-ChildItem dist/win-unpacked/*.exe | Select-Object -First 1
          if (-not $app) { throw 'Raw Windows executable was not produced.' }

          $process = Start-Process -FilePath $app.FullName -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Raw Windows application did not complete the smoke launch.'
          }

          if ($process.ExitCode -ne 0) {
            throw "Raw Windows application exited with code $($process.ExitCode)."
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-raw-electron
          path: dist/win-unpacked/**
          if-no-files-found: error
